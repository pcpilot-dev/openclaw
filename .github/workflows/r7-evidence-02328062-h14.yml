      - name: Seal final manifest and logs
        id: seal
        if: always()
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          required = {
              "buildhashmanifest.json", "final.ended", "final.exit", "final.log",
              "final.started", "finalstatus.json", "manifest.json",
          }
          entries = sorted(evidence.iterdir(), key=lambda path: path.name)
          invalid = [path.name for path in entries if path.is_symlink() or not path.is_file()]
          if invalid:
              raise SystemExit(f"non-regular final evidence: {invalid!r}")
          actual = {path.name for path in entries}
          if not required.issubset(actual):
              raise SystemExit(f"final evidence missing: {sorted(required-actual)!r}")

          def strict_utc_marker(name: str) -> datetime:
              path = evidence / name
              raw = path.read_bytes()
              if len(raw) != 21 or raw[-1:] != b"\n":
                  raise SystemExit(f"invalid UTC marker bytes: {name}")
              try:
                  value = raw[:-1].decode("ascii")
              except UnicodeDecodeError as exc:
                  raise SystemExit(f"invalid UTC marker ASCII: {name}") from exc
              if not re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", value):
                  raise SystemExit(f"invalid UTC marker shape: {name}")
              try:
                  parsed = datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=timezone.utc)
              except ValueError as exc:
                  raise SystemExit(f"invalid UTC marker calendar value: {name}") from exc
              if parsed.strftime("%Y-%m-%dT%H:%M:%SZ") != value:
                  raise SystemExit(f"non-canonical UTC marker: {name}")
              return parsed

          started = strict_utc_marker("final.started")
          ended = strict_utc_marker("final.ended")
          if started > ended:
              raise SystemExit("negative UTC interval: final")
          hashes = {path.name: hashlib.sha256(path.read_bytes()).hexdigest() for path in entries}
          (evidence / "seal.json").write_text(
              json.dumps({
                  "algorithm": "sha256",
                  "files": hashes,
                  "sealContainer": "seal.json",
                  "artifactFiles": sorted([*hashes, "seal.json"]),
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Verify final seal and exact upload file set
        id: verify_seal
        if: always()
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE_DIR"])
          seal_path = evidence / "seal.json"
          if not seal_path.is_file() or seal_path.is_symlink():
              raise SystemExit("final seal missing or non-regular")
          entries = sorted(evidence.iterdir(), key=lambda path: path.name)
          invalid = [path.name for path in entries if path.is_symlink() or not path.is_file()]
          if invalid:
              raise SystemExit(f"non-regular final upload entry: {invalid!r}")
          actual = {path.name for path in entries}
          seal = json.loads(seal_path.read_text(encoding="utf-8"))
          files = seal.get("files") if isinstance(seal, dict) else None
          artifact_files = seal.get("artifactFiles") if isinstance(seal, dict) else None
          if seal.get("algorithm") != "sha256" or seal.get("sealContainer") != "seal.json":
              raise SystemExit("invalid final seal metadata")
          if not isinstance(files, dict) or not isinstance(artifact_files, list):
              raise SystemExit("invalid final seal file-set shape")
          if set(files) != actual - {"seal.json"}:
              raise SystemExit("seal.files does not bind the complete non-self-referential evidence set")
          if set(artifact_files) != actual or len(artifact_files) != len(actual):
              raise SystemExit("artifactFiles does not exactly match the upload directory")
          for name, expected_hash in files.items():
              if not isinstance(expected_hash, str) or len(expected_hash) != 64:
                  raise SystemExit(f"invalid sealed hash for {name}")
              if hashlib.sha256((evidence / name).read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f"final seal hash mismatch: {name}")
          PY
      - name: Upload final H14 envelope
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-h14-final-P2-${{ github.run_id }}-attempt-1
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90
          overwrite: false
