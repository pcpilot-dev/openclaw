                      errors.append(f"invalid sample shape line {index}")
                      continue
                  if value.get("sequence") != index:
                      errors.append(f"non-contiguous sample sequence line {index}")
                  records.append(value)
              reasons = [item.get("reason") for item in records]
              if "final" not in reasons:
                  errors.append("sampler lacks final sample")
              return {
                  "count": len(records),
                  "preSigtermSamples": reasons.count("pre_sigterm"),
                  "terminalObservedSamples": reasons.count("terminal_observed"),
                  "finalSamples": reasons.count("final"),
