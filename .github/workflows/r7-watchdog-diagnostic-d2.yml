              return isinstance(value, int) and not isinstance(value, bool) and value >= 0


          def validate_watchdog_markers(stderr, label, cap, heartbeat, test_exit):
              heartbeat_prefix = "[vitest] still running with no output for "
              terminal_prefix = "[vitest] no output for "
              force_prefix = "[vitest] process group still alive after "
              expected_heartbeats = [
                  f"{heartbeat_prefix}{elapsed}ms ({label})."
                  for elapsed in range(heartbeat, cap, heartbeat)
              ]
              terminal = f"{terminal_prefix}{cap}ms; terminating stalled Vitest process group ({label})."
              force = f"{force_prefix}5000ms; sending SIGKILL ({label})."
              marker_events = []
              terminal_count = 0
              force_count = 0
              marker_prefixes = (heartbeat_prefix, terminal_prefix, force_prefix)
              for line_number, line in enumerate(stderr.splitlines(), start=1):
                  if line in expected_heartbeats:
                      marker_events.append(line)
                  elif line == terminal:
                      marker_events.append(line)
                      terminal_count += 1
                  elif line == force:
                      marker_events.append(line)
                      force_count += 1
                      if len(marker_events) < 2 or marker_events[-2] != terminal:
                          errors.append("force-kill marker is not exactly after the terminal marker")
                  elif line.startswith(marker_prefixes):
                      marker_events.append(line)
                      errors.append(f"unbound or malformed watchdog marker at stderr line {line_number}")
              if terminal_count > 1 or force_count > 1:
                  errors.append("duplicate watchdog terminal or force marker")
              expected_suffix = expected_heartbeats + [terminal]
              if test_exit == 137 and terminal_count == 1:
                  expected_suffix += [force]
              if terminal_count == 1 and marker_events[-len(expected_suffix):] != expected_suffix:
                  errors.append("final watchdog marker suffix is incomplete or out of order")
              if terminal_count and test_exit not in (137, 143):
                  errors.append("watchdog terminal marker conflicts with process exit signal")
              if test_exit == 143 and force_count != 0:
                  errors.append("SIGTERM exit conflicts with force-kill marker")
              if test_exit == 137 and terminal_count == 1 and force_count != 1:
                  errors.append("SIGKILL exit lacks exactly one post-terminal force-kill marker")
              if force_count and test_exit != 137:
                  errors.append("force-kill marker conflicts with non-SIGKILL exit")
              if force_count and terminal_count != 1:
                  errors.append("force-kill marker exists without exactly one terminal marker")
              signal_number = 15 if test_exit == 143 else 9 if test_exit == 137 else None
              return {
                  "terminal": terminal,
                  "force": force,
                  "terminalCount": terminal_count,
                  "forceCount": force_count,
                  "heartbeatCount": sum(1 for item in marker_events if item in expected_heartbeats),
                  "expectedHeartbeatCount": len(expected_heartbeats),
                  "markerEventCount": len(marker_events),
                  "finalSuffixValid": terminal_count == 1 and marker_events[-len(expected_suffix):] == expected_suffix,
                  "signalNumber": signal_number,
