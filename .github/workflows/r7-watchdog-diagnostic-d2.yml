      - name: Seal exact diagnostic evidence set
        id: seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          excluded = {"seal.files", "seal.json", "seal.sha256"}
          files = sorted(path for path in root.rglob("*") if path.is_file() and path.name not in excluded)
          for path in root.rglob("*"):
              if path.is_symlink():
                  raise SystemExit(f"symlink forbidden in evidence: {path}")
              if path.is_dir() or path.is_file():
                  continue
              raise SystemExit(f"non-regular evidence entry: {path}")
          entries = []
          for path in files:
              relative = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entries.append({"path": relative, "sha256": digest, "bytes": path.stat().st_size})
          seal_files = root / "seal.files"
          seal_files.write_text("".join(f"{entry['sha256']}  {entry['path']}\n" for entry in entries), encoding="utf-8")
          artifact_files = sorted([entry["path"] for entry in entries] + ["seal.files", "seal.json", "seal.sha256"])
          seal = {
              "schema": "r7-watchdog-diagnostic-seal-v1",
              "disposition": "DIAGNOSTIC_ONLY",
              "selfReferenceFree": True,
              "sealedFiles": entries,
              "sealFilesSha256": hashlib.sha256(seal_files.read_bytes()).hexdigest(),
              "artifactFiles": artifact_files,
          }
          seal_json = root / "seal.json"
          seal_json.write_text(json.dumps(seal, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          seal_sha = root / "seal.sha256"
          seal_sha.write_text(
              f"{hashlib.sha256(seal_files.read_bytes()).hexdigest()}  seal.files\n"
              f"{hashlib.sha256(seal_json.read_bytes()).hexdigest()}  seal.json\n",
              encoding="utf-8",
          )
          PY

      - name: Verify seal and exact upload file set
        id: verify_seal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import datetime
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          seal = json.loads((root / "seal.json").read_text(encoding="utf-8"))
          if seal.get("disposition") != "DIAGNOSTIC_ONLY" or seal.get("selfReferenceFree") is not True:
              raise SystemExit("seal disposition or self-reference contract mismatch")
          utc_re = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\n$")
          utc_values = {}
          for name in ("job.started", "final.started", "final.ended"):
              text = (root / name).read_text(encoding="ascii")
              if len(text) != 21 or not utc_re.fullmatch(text):
                  raise SystemExit(f"invalid strict UTC marker in sealed envelope: {name}")
              utc_values[name] = datetime.datetime.strptime(text.strip(), "%Y-%m-%dT%H:%M:%SZ")
          if utc_values["final.started"] < utc_values["job.started"] or utc_values["final.ended"] < utc_values["final.started"]:
              raise SystemExit("sealed final UTC interval is reversed")
          if (root / "final.exit").read_text(encoding="ascii") not in ("0\n", "1\n"):
              raise SystemExit("sealed final.exit is invalid")
          required = {
              "command.txt", "diagnostic-manifest.json", "disposition.txt", "final.ended", "final.exit",
              "final.started", "finalizer.log", "finalstatus.json", "harness-guard.ended",
              "harness-guard.started", "harness.head", "harness.message", "harness.numstat",
              "harness.parent", "job.started", "runner.arch", "runner.environment", "runner.image-os",
              "runner.image-version", "runner.os", "sampler.py",
              "sampler.stderr.log", "sampler.stdout.log", "test.stderr.log", "test.stdout.log",
          }
          actual = sorted(path.relative_to(root).as_posix() for path in root.rglob("*") if path.is_file())
          if actual != seal["artifactFiles"]:
              raise SystemExit("artifact file set differs from sealed exact set")
          if not required.issubset(actual):
              raise SystemExit("sealed envelope lacks required diagnostic files")
          if any(path.is_symlink() for path in root.rglob("*")):
              raise SystemExit("symlink present in upload set")
          expected_lines = []
          for entry in seal["sealedFiles"]:
              path = root / entry["path"]
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"sealed file unavailable: {entry['path']}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != entry["sha256"] or path.stat().st_size != entry["bytes"]:
                  raise SystemExit(f"sealed file mismatch: {entry['path']}")
              expected_lines.append(f"{digest}  {entry['path']}\n")
          if (root / "seal.files").read_text(encoding="utf-8") != "".join(expected_lines):
              raise SystemExit("seal.files mismatch")
          if hashlib.sha256((root / "seal.files").read_bytes()).hexdigest() != seal["sealFilesSha256"]:
              raise SystemExit("seal.files digest mismatch")
          expected_seal_sha = (
              f"{hashlib.sha256((root / 'seal.files').read_bytes()).hexdigest()}  seal.files\n"
              f"{hashlib.sha256((root / 'seal.json').read_bytes()).hexdigest()}  seal.json\n"
          )
          if (root / "seal.sha256").read_text(encoding="utf-8") != expected_seal_sha:
              raise SystemExit("seal container digest mismatch")
          PY

      - name: Upload exact diagnostic-only evidence envelope
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-watchdog-d2-${{ matrix.index }}-${{ matrix.id }}-P2-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r7-watchdog-d2-${{ matrix.index }}-${{ matrix.id }}-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: true
