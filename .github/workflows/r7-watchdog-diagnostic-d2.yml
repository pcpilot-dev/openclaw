      - name: Run exactly one diagnostic Vitest process with bounded sampler
        id: diagnostic_run
        timeout-minutes: ${{ matrix.step_timeout_minutes }}
        shell: bash
        run: |
          set -euo pipefail
          expected_command="GITHUB_WORKSPACE=$GITHUB_WORKSPACE node scripts/run-vitest.mjs run --config $BOUND_CONFIG --reporter=verbose --reporter=json --outputFile.json=$BOUND_JSON"
          printf '%s\n' "$expected_command" > "$EVIDENCE_DIR/command.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/test.started"
          set +e
          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" node scripts/run-vitest.mjs run \
            --config "$BOUND_CONFIG" \
            --reporter=verbose \
            --reporter=json \
            --outputFile.json="$BOUND_JSON" \
            > "$STDOUT_LOG" 2> "$STDERR_LOG" &
          test_pid=$!
          printf '%s\n' "$test_pid" > "$EVIDENCE_DIR/test.pid"
          python3 "$EVIDENCE_DIR/sampler.py" \
            --pid "$test_pid" \
            --silence-cap-ms "$WATCHDOG_SILENCE_CAP_MS" \
            --heartbeat-ms "$WATCHDOG_HEARTBEAT_MS" \
            --stdout "$STDOUT_LOG" \
            --stderr "$STDERR_LOG" \
            --reporter "$BOUND_JSON" \
            --workspace "$GITHUB_WORKSPACE" \
            --evidence "$EVIDENCE_DIR" \
            --output "$EVIDENCE_DIR/samples.jsonl" \
            > "$EVIDENCE_DIR/sampler.stdout.log" 2> "$EVIDENCE_DIR/sampler.stderr.log" &
          sampler_pid=$!
          printf '%s\n' "$sampler_pid" > "$EVIDENCE_DIR/sampler.pid"
          wait "$test_pid"
          test_exit=$?
          wait "$sampler_pid"
          sampler_exit=$?
          set -e
          printf '%s\n' "$test_exit" > "$EVIDENCE_DIR/test.exit"
          printf '%s\n' "$sampler_exit" > "$EVIDENCE_DIR/sampler.exit"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/test.ended"
          if test "$sampler_exit" -ne 0; then
            exit 90
          fi
          exit "$test_exit"

      - name: Capture final resources and detached P2 poststate
        id: poststate
        if: always()
        shell: bash
        run: |
          set +e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/post.utc"
          git rev-parse HEAD > "$EVIDENCE_DIR/post.head" 2> "$EVIDENCE_DIR/post.head.error"
          head_exit=$?
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/post.tree" 2> "$EVIDENCE_DIR/post.tree.error"
          tree_exit=$?
          git rev-parse HEAD^ > "$EVIDENCE_DIR/post.parent" 2> "$EVIDENCE_DIR/post.parent.error"
          parent_exit=$?
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/post.status" 2> "$EVIDENCE_DIR/post.status.error"
          status_exit=$?
          nproc > "$EVIDENCE_DIR/post.nproc" 2> "$EVIDENCE_DIR/post.nproc.error"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$EVIDENCE_DIR/post.df" 2> "$EVIDENCE_DIR/post.df.error"
          if test -r /proc/meminfo; then
            cp /proc/meminfo "$EVIDENCE_DIR/post.meminfo"
          else
            printf '%s\n' "NOT_AVAILABLE" > "$EVIDENCE_DIR/post.meminfo"
          fi
          for pressure in cpu memory io; do
            if test -r "/proc/pressure/$pressure"; then
              cp "/proc/pressure/$pressure" "$EVIDENCE_DIR/post.psi.$pressure"
            else
              printf '%s\n' "NOT_AVAILABLE" > "$EVIDENCE_DIR/post.psi.$pressure"
            fi
          done
          post_exit=0
          test "$head_exit" -eq 0 || post_exit=1
          test "$tree_exit" -eq 0 || post_exit=1
          test "$parent_exit" -eq 0 || post_exit=1
          test "$status_exit" -eq 0 || post_exit=1
          test "$(cat "$EVIDENCE_DIR/post.head" 2>/dev/null)" = "$P2_SHA" || post_exit=1
          test "$(cat "$EVIDENCE_DIR/post.tree" 2>/dev/null)" = "$P2_TREE" || post_exit=1
          test "$(cat "$EVIDENCE_DIR/post.parent" 2>/dev/null)" = "$P_SHA" || post_exit=1
          test ! -s "$EVIDENCE_DIR/post.status" || post_exit=1
          printf '%s\n' "$post_exit" > "$EVIDENCE_DIR/poststate.exit"
          exit "$post_exit"

