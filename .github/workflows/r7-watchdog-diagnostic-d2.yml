              if not lines:
                  errors.append("empty samples.jsonl")
                  return {"count": 0, "preSigtermSamples": 0, "finalSamples": 0}
              records = []
              for index, line in enumerate(lines, start=1):
                  try:
                      value = json.loads(line)
                  except json.JSONDecodeError:
                      errors.append(f"invalid sample JSON line {index}")
                      continue
