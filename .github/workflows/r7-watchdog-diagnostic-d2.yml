          evidence = pathlib.Path(os.environ["EVIDENCE_DIR"])
          errors = []
          UTC_RE = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\n$")


          def read(name):
              path = evidence / name
              try:
                  return path.read_text(encoding="utf-8")
              except (OSError, UnicodeDecodeError):
                  errors.append(f"missing or unreadable {name}")
                  return None


          def read_int(name):
              text = read(name)
              if text is None:
                  return None
              value = text.strip()
              if not re.fullmatch(r"[0-9]+", value):
                  errors.append(f"invalid integer {name}")
                  return None
              return int(value)


          def valid_utc(name):
              text = read(name)
              if text is None:
                  return None
              if len(text.encode("ascii", errors="ignore")) != 21 or not UTC_RE.fullmatch(text):
                  errors.append(f"invalid strict UTC marker {name}")
                  return None
              try:
                  return datetime.datetime.strptime(text.strip(), "%Y-%m-%dT%H:%M:%SZ").replace(
                      tzinfo=datetime.timezone.utc
                  )
              except ValueError:
                  errors.append(f"invalid UTC calendar value {name}")
                  return None


