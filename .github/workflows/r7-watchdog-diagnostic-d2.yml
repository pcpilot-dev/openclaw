name: Gateway r7 Watchdog Diagnostic D2 · DIAGNOSTIC_ONLY
run-name: Gateway r7 D2 · DIAGNOSTIC_ONLY · run ${{ github.run_id }} attempt ${{ github.run_attempt }}

on:
  push:
    branches:
      - codex/evidence-gateway-r7-watchdog-diagnostic-d2

permissions:
  contents: read

concurrency:
  group: r7-watchdog-diagnostic-d2
  cancel-in-progress: false

env:
  BASE_SHA: 435e341a6ccd3db1f0d07504931f32385d10d6df
  BASE_TREE: 916f825917a49da59c180a4cdabec3f0ce08227e
  P_SHA: 7b89bf143d3c63e916847d58b92b5727fc16e4ca
  P_TREE: 5f9eef5fd0c3e496910e2b3ab9db31023a43ca94
  P2_SHA: 7492177a7068ca7481dd355f37b2d7a21630e9bc
  P2_TREE: 39349f53cf8b6e5fbed55c8769ed5e5905965894
  EXPECTED_REPOSITORY: pcpilot-dev/openclaw
  EXPECTED_REF: refs/heads/codex/evidence-gateway-r7-watchdog-diagnostic-d2
  WORKFLOW_PATH: .github/workflows/r7-watchdog-diagnostic-d2.yml
  EXPECTED_H_PARENT: 7492177a7068ca7481dd355f37b2d7a21630e9bc
  EXPECTED_H_MESSAGE: "ci: harden gateway r7 watchdog diagnostics d2"
  EXPECTED_H_ADDITIONS: "1262"
  PACKAGE_BLOB_SHA: f63ea7030f84032ec3021b3459084655dd584e9a
  LOCK_BLOB_SHA: e9940a0c1404b1b6c584701351a93282f12bab77
  RUN_VITEST_BLOB_SHA: 4f8b6d1abd0c94016f6c5f56f05ce219e8d9dfaa
  SHARDS_BLOB_SHA: 7b0154d3cb15713b2ee138c5b15fddfecb6ca1fc
  PROJECT_SHARD_CONFIG_BLOB_SHA: 743bd62ecd2fdc02e44edc8014d254f5d2b375a5
  SHARED_CONFIG_BLOB_SHA: 9c5342e3498633bc72a29b9639ac620b799f73f9
  TIMEOUTS_BLOB_SHA: 5816139df0ac52117d330775267298a08082017a
  EXPECTED_PACKAGE_MANAGER: pnpm@11.15.1+sha512.81350b07e53c9538a02f1f2303b4290fa2d7be04e56e2a970c4cc4b417dc761de196edabd49d55c7dc9580db81007c44143e4e3d7e462b3000d23c255122d065
  EXPECTED_PNPM_VERSION: 11.15.1
  EXPECTED_NODE_VERSION: 24.15.0
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=8192
  OPENCLAW_VITEST_MAX_WORKERS: "2"

jobs:
  diagnostic:
    name: D2 ${{ matrix.index }} · ${{ matrix.id }} · DIAGNOSTIC_ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - index: "01"
            id: core-tooling
            config: test/vitest/vitest.full-core-tooling.config.ts
            config_blob: 221e38c68aebf78c01239bfab0e50c771d37e93a
            silence_cap_ms: 120000
            heartbeat_ms: 30000
            step_timeout_minutes: 45
            job_timeout_minutes: 90
          - index: "02"
            id: agentic
            config: test/vitest/vitest.full-agentic.config.ts
            config_blob: ae3bb10356cf450df13ac55acd0e2e970e148cc1
            silence_cap_ms: 300000
            heartbeat_ms: 30000
            step_timeout_minutes: 120
            job_timeout_minutes: 165
    env:
      DIAGNOSTIC_INDEX: ${{ matrix.index }}
      DIAGNOSTIC_ID: ${{ matrix.id }}
      BOUND_CONFIG: ${{ matrix.config }}
      BOUND_CONFIG_BLOB_SHA: ${{ matrix.config_blob }}
      WATCHDOG_SILENCE_CAP_MS: ${{ matrix.silence_cap_ms }}
      WATCHDOG_HEARTBEAT_MS: ${{ matrix.heartbeat_ms }}
      STEP_TIMEOUT_MINUTES: ${{ matrix.step_timeout_minutes }}
      JOB_TIMEOUT_MINUTES: ${{ matrix.job_timeout_minutes }}

    steps:
      - name: Initialize diagnostic evidence and fresh store
        id: initialize
        env:
          EVIDENCE_DIR_INIT: ${{ runner.temp }}/r7-watchdog-d2-${{ matrix.index }}-${{ matrix.id }}-evidence
          PNPM_STORE_DIR_INIT: ${{ runner.temp }}/r7-watchdog-d2-${{ matrix.index }}-${{ matrix.id }}-store
          RUNNER_ENVIRONMENT_INIT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT_INIT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          test "$EVIDENCE_DIR_INIT" = "$RUNNER_TEMP/r7-watchdog-d2-$DIAGNOSTIC_INDEX-$DIAGNOSTIC_ID-evidence"
          test "$PNPM_STORE_DIR_INIT" = "$RUNNER_TEMP/r7-watchdog-d2-$DIAGNOSTIC_INDEX-$DIAGNOSTIC_ID-store"
          test ! -e "$EVIDENCE_DIR_INIT"
          test ! -e "$PNPM_STORE_DIR_INIT"
          mkdir -p "$EVIDENCE_DIR_INIT"
          EVIDENCE_DIR="$EVIDENCE_DIR_INIT"
          PNPM_STORE_DIR="$PNPM_STORE_DIR_INIT"
          BOUND_JSON="$EVIDENCE_DIR/reporter.json"
          STDOUT_LOG="$EVIDENCE_DIR/test.stdout.log"
          STDERR_LOG="$EVIDENCE_DIR/test.stderr.log"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          printf 'PNPM_STORE_DIR=%s\n' "$PNPM_STORE_DIR" >> "$GITHUB_ENV"
          printf 'BOUND_JSON=%s\n' "$BOUND_JSON" >> "$GITHUB_ENV"
          printf 'STDOUT_LOG=%s\n' "$STDOUT_LOG" >> "$GITHUB_ENV"
          printf 'STDERR_LOG=%s\n' "$STDERR_LOG" >> "$GITHUB_ENV"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/job.started"
          : > "$STDOUT_LOG"
          : > "$STDERR_LOG"
          printf '%s\n' "DIAGNOSTIC_ONLY" > "$EVIDENCE_DIR/disposition.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$EVIDENCE_DIR/run.id"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$EVIDENCE_DIR/run.attempt"
          printf '%s\n' "$GITHUB_SHA" > "$EVIDENCE_DIR/harness.event-sha"
          printf '%s\n' "$GITHUB_REF" > "$EVIDENCE_DIR/event.ref"
          printf '%s\n' "$RUNNER_ENVIRONMENT_INIT" > "$EVIDENCE_DIR/runner.environment"
          printf '%s\n' "$RUNNER_OS" > "$EVIDENCE_DIR/runner.os"
          printf '%s\n' "$RUNNER_ARCH" > "$EVIDENCE_DIR/runner.arch"
          printf '%s\n' "$ImageOS" > "$EVIDENCE_DIR/runner.image-os"
          printf '%s\n' "$ImageVersion" > "$EVIDENCE_DIR/runner.image-version"

      - name: Checkout credential-free event harness commit
        id: harness_checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Guard event harness identity, parent, scope, and runner
        id: harness_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
          EVENT_ATTEMPT: ${{ github.run_attempt }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_GUARD: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/harness-guard.started"
          test "$EVENT_NAME" = "push"
          test "$EVENT_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$EVENT_REF" = "$EXPECTED_REF"
          test "$EVENT_ATTEMPT" = "1"
          test -n "$EVENT_ACTOR"
          test "$EVENT_WORKFLOW_REF" = "$EXPECTED_REPOSITORY/$WORKFLOW_PATH@$EXPECTED_REF"
          test "$EVENT_WORKFLOW_SHA" = "$EVENT_SHA"
          test "$RUNNER_ENVIRONMENT_GUARD" = "github-hosted"
          test "$RUNNER_ENVIRONMENT_GUARD" = "$(cat "$EVIDENCE_DIR/runner.environment")"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$RUNNER_OS" = "$(cat "$EVIDENCE_DIR/runner.os")"
          test "$RUNNER_ARCH" = "$(cat "$EVIDENCE_DIR/runner.arch")"
          test -n "${ImageOS:-}"
          test -n "${ImageVersion:-}"
          test "$ImageOS" = "$(cat "$EVIDENCE_DIR/runner.image-os")"
          test "$ImageVersion" = "$(cat "$EVIDENCE_DIR/runner.image-version")"
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_WORKFLOW_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" = "2"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_H_PARENT"
          test "$(git show -s --format=%s HEAD)" = "$EXPECTED_H_MESSAGE"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = $'A\t'"$WORKFLOW_PATH"
          test "$(git diff --numstat "$EXPECTED_H_PARENT" HEAD -- "$WORKFLOW_PATH")" = "$EXPECTED_H_ADDITIONS"$'\t0\t'"$WORKFLOW_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$EVENT_SHA" > "$EVIDENCE_DIR/harness.head"
          printf '%s\n' "$EXPECTED_H_PARENT" > "$EVIDENCE_DIR/harness.parent"
          printf '%s\n' "$EXPECTED_H_MESSAGE" > "$EVIDENCE_DIR/harness.message"
          printf '%s\t0\t%s\n' "$EXPECTED_H_ADDITIONS" "$WORKFLOW_PATH" > "$EVIDENCE_DIR/harness.numstat"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/harness-guard.ended"

      - name: Checkout detached P2 source after harness guard
        id: source_checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 7492177a7068ca7481dd355f37b2d7a21630e9bc
          fetch-depth: 3
          persist-credentials: false

      - name: Guard detached P2 and bound source blobs
        id: source_guard
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/guard.started"
          test "$(git rev-parse HEAD)" = "$P2_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$P2_TREE"
          test "$(git rev-parse HEAD^)" = "$P_SHA"
          test "$(git rev-parse HEAD^^)" = "$BASE_SHA"
          test "$(git rev-parse "$P_SHA^{tree}")" = "$P_TREE"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git hash-object package.json)" = "$PACKAGE_BLOB_SHA"
          test "$(git hash-object pnpm-lock.yaml)" = "$LOCK_BLOB_SHA"
          test "$(git hash-object scripts/run-vitest.mjs)" = "$RUN_VITEST_BLOB_SHA"
          test "$(git hash-object test/vitest/vitest.test-shards.mjs)" = "$SHARDS_BLOB_SHA"
          test "$(git hash-object test/vitest/vitest.project-shard-config.ts)" = "$PROJECT_SHARD_CONFIG_BLOB_SHA"
          test "$(git hash-object test/vitest/vitest.shared.config.ts)" = "$SHARED_CONFIG_BLOB_SHA"
          test "$(git hash-object test/vitest/vitest.timeouts.ts)" = "$TIMEOUTS_BLOB_SHA"
          test "$(git hash-object "$BOUND_CONFIG")" = "$BOUND_CONFIG_BLOB_SHA"
          test "$(node -p "require('./package.json').packageManager")" = "$EXPECTED_PACKAGE_MANAGER"
          test "$(sed -n 's/^export const DEFAULT_VITEST_TEST_TIMEOUT_MS = \([0-9_]*\);$/\1/p' test/vitest/vitest.timeouts.ts | tr -d _ )" = "120000"
          printf '%s\n' "$P2_SHA" > "$EVIDENCE_DIR/guard.head"
          printf '%s\n' "$P2_TREE" > "$EVIDENCE_DIR/guard.tree"
          printf '%s\n' "$P_SHA" > "$EVIDENCE_DIR/guard.parent"
          printf '%s\n' "$BOUND_CONFIG" > "$EVIDENCE_DIR/config.path"
          printf '%s\n' "$BOUND_CONFIG_BLOB_SHA" > "$EVIDENCE_DIR/config.blob"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/guard.ended"

      - name: Set up exact Node 24.15.0
        id: setup_node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          check-latest: false

      - name: Bind exact pnpm and fresh store
        id: bind_pnpm
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$EXPECTED_NODE_VERSION"
          test "$(node -p "require('./package.json').packageManager")" = "$EXPECTED_PACKAGE_MANAGER"
          test ! -e "$PNPM_STORE_DIR"
          mkdir -p "$PNPM_STORE_DIR"
          corepack enable
          corepack prepare "$EXPECTED_PACKAGE_MANAGER" --activate
          test "$(pnpm --version)" = "$EXPECTED_PNPM_VERSION"
          printf '%s\n' "$(node --version)" > "$EVIDENCE_DIR/node.version"
          printf '%s\n' "$(pnpm --version)" > "$EVIDENCE_DIR/pnpm.version"
          printf '%s\n' "$EXPECTED_PACKAGE_MANAGER" > "$EVIDENCE_DIR/package-manager.txt"
          printf '%s\n' "$PNPM_STORE_DIR" > "$EVIDENCE_DIR/store.path"

      - name: Frozen install exactly once
        id: frozen_install
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/install.started"
          set +e
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" > "$EVIDENCE_DIR/install.stdout.log" 2> "$EVIDENCE_DIR/install.stderr.log"
          install_exit=$?
          set -e
          printf '%s\n' "$install_exit" > "$EVIDENCE_DIR/install.exit"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/install.ended"
          exit "$install_exit"

      - name: Capture pre-run source and resources
        id: prestate
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > "$EVIDENCE_DIR/pre.utc"
          git rev-parse HEAD > "$EVIDENCE_DIR/pre.head"
          git rev-parse HEAD^{tree} > "$EVIDENCE_DIR/pre.tree"
          git rev-parse HEAD^ > "$EVIDENCE_DIR/pre.parent"
          git status --porcelain=v1 --untracked-files=all > "$EVIDENCE_DIR/pre.status"
          nproc > "$EVIDENCE_DIR/pre.nproc"
          df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$EVIDENCE_DIR/pre.df"
          cp /proc/meminfo "$EVIDENCE_DIR/pre.meminfo"
          for pressure in cpu memory io; do
            if test -r "/proc/pressure/$pressure"; then
              cp "/proc/pressure/$pressure" "$EVIDENCE_DIR/pre.psi.$pressure"
            else
              printf '%s\n' "NOT_AVAILABLE" > "$EVIDENCE_DIR/pre.psi.$pressure"
            fi
          done
          test "$(cat "$EVIDENCE_DIR/pre.head")" = "$P2_SHA"
          test "$(cat "$EVIDENCE_DIR/pre.tree")" = "$P2_TREE"
          test "$(cat "$EVIDENCE_DIR/pre.parent")" = "$P_SHA"
          test ! -s "$EVIDENCE_DIR/pre.status"

      - name: Prepare bounded non-interfering sampler
        id: prepare_sampler
        shell: bash
        run: |
          set -euo pipefail
          cat > "$EVIDENCE_DIR/sampler.py" <<'PY'
          import argparse
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import time

          NOT_AVAILABLE = "NOT_AVAILABLE"
          SAMPLE_INTERVAL_SECONDS = 10.0
          POLL_INTERVAL_SECONDS = 1.0
          PRE_SIGNAL_LEAD_SECONDS = 1.0
          HINT_RE = re.compile(r"\b(?:project|file|test|hook|reporter)\b", re.IGNORECASE)
          ANSI_RE = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")


          def utc_now():
              return datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


          def read_text(path, limit=262144):
              try:
                  data = pathlib.Path(path).read_bytes()
                  if len(data) > limit:
                      data = data[-limit:]
                  return data.decode("utf-8", errors="replace")
              except (OSError, ValueError):
                  return None


          def read_proc_text(pid, name, limit=262144):
              return read_text(f"/proc/{pid}/{name}", limit=limit)


          def parse_status(text):
              if text is None:
                  return NOT_AVAILABLE
              allowed = {
                  "Name", "State", "PPid", "Threads", "VmPeak", "VmSize", "VmHWM", "VmRSS",
                  "RssAnon", "RssFile", "RssShmem", "voluntary_ctxt_switches",
                  "nonvoluntary_ctxt_switches",
              }
              result = {}
              for line in text.splitlines():
                  key, sep, value = line.partition(":")
                  if sep and key in allowed:
                      result[key] = value.strip()
              return result or NOT_AVAILABLE


          def parse_io(text):
              if text is None:
                  return NOT_AVAILABLE
              result = {}
              for line in text.splitlines():
                  key, sep, value = line.partition(":")
                  if sep:
                      result[key] = value.strip()
              return result or NOT_AVAILABLE


          def parse_stat(text):
              if text is None:
                  return NOT_AVAILABLE
              try:
                  closing = text.rindex(")")
                  fields = text[closing + 2 :].split()
                  clock_ticks = os.sysconf("SC_CLK_TCK")
                  page_size = os.sysconf("SC_PAGE_SIZE")
                  uptime_text = read_text("/proc/uptime", limit=65536)
                  uptime_seconds = float(uptime_text.split()[0]) if uptime_text is not None else None
                  user_ticks = int(fields[11])
                  system_ticks = int(fields[12])
                  threads = int(fields[17])
                  start_ticks = int(fields[19])
                  rss_pages = int(fields[21])
                  elapsed_ms = (
                      int(max(0.0, uptime_seconds - (start_ticks / clock_ticks)) * 1000)
                      if uptime_seconds is not None else NOT_AVAILABLE
                  )
                  return {
                      "state": fields[0],
                      "ppid": int(fields[1]),
                      "cpuUserTicks": user_ticks,
                      "cpuSystemTicks": system_ticks,
                      "cpuTotalTicks": user_ticks + system_ticks,
                      "threads": threads,
                      "rssPages": rss_pages,
                      "rssBytes": rss_pages * page_size,
                      "elapsedMillis": elapsed_ms,
                  }
              except (ValueError, IndexError, OSError):
                  return NOT_AVAILABLE


          def child_pids(pid):
              text = read_proc_text(pid, f"task/{pid}/children", limit=65536)
              if text is None:
                  return []
              children = []
              for token in text.split():
                  if token.isdigit():
                      children.append(int(token))
              return children


          def process_tree(root_pid):
              pending = [root_pid]
              seen = set()
              ordered = []
              while pending and len(seen) < 256:
                  pid = pending.pop(0)
                  if pid in seen:
                      continue
                  seen.add(pid)
                  ordered.append(pid)
                  pending.extend(child_pids(pid))
              return ordered


          def process_record(pid):
              status_text = read_proc_text(pid, "status")
              stat_text = read_proc_text(pid, "stat", limit=65536)
              wchan_text = read_proc_text(pid, "wchan", limit=65536)
              io_text = read_proc_text(pid, "io", limit=65536)
              status = parse_status(status_text)
              stat_summary = parse_stat(stat_text)
              try:
                  fd_count = len(os.listdir(f"/proc/{pid}/fd"))
              except OSError:
                  fd_count = NOT_AVAILABLE
              stat_fields = stat_text.strip() if stat_text is not None else NOT_AVAILABLE
              return {
                  "pid": pid,
                  "ppid": (stat_summary.get("ppid", NOT_AVAILABLE)
                           if isinstance(stat_summary, dict) else NOT_AVAILABLE),
                  "status": status,
                  "elapsedMillis": (stat_summary.get("elapsedMillis", NOT_AVAILABLE)
                                    if isinstance(stat_summary, dict) else NOT_AVAILABLE),
                  "cpu": ({
                      "userTicks": stat_summary["cpuUserTicks"],
                      "systemTicks": stat_summary["cpuSystemTicks"],
                      "totalTicks": stat_summary["cpuTotalTicks"],
                  } if isinstance(stat_summary, dict) else NOT_AVAILABLE),
                  "rssBytes": (stat_summary.get("rssBytes", NOT_AVAILABLE)
                               if isinstance(stat_summary, dict) else NOT_AVAILABLE),
                  "threads": (stat_summary.get("threads", NOT_AVAILABLE)
                              if isinstance(stat_summary, dict) else NOT_AVAILABLE),
                  "stat": stat_fields,
                  "statSummary": stat_summary,
                  "wchan": wchan_text.strip() if wchan_text is not None else NOT_AVAILABLE,
                  "io": parse_io(io_text),
                  "fdCount": fd_count,
              }


          def pressure_snapshot():
              result = {}
              for name in ("cpu", "memory", "io"):
                  text = read_text(f"/proc/pressure/{name}", limit=65536)
                  result[name] = text.strip() if text is not None else NOT_AVAILABLE
              return result


          def memory_snapshot():
              text = read_text("/proc/meminfo", limit=262144)
              if text is None:
                  return NOT_AVAILABLE
              wanted = {"MemTotal", "MemFree", "MemAvailable", "Buffers", "Cached", "SwapTotal", "SwapFree"}
              result = {}
              for line in text.splitlines():
                  key, sep, value = line.partition(":")
                  if sep and key in wanted:
                      result[key] = value.strip()
              return result or NOT_AVAILABLE


          def disk_snapshot(path):
              try:
                  stats = os.statvfs(path)
                  return {
                      "blockSize": stats.f_frsize,
                      "blocks": stats.f_blocks,
                      "blocksFree": stats.f_bfree,
                      "blocksAvailable": stats.f_bavail,
                      "bytesTotal": stats.f_frsize * stats.f_blocks,
                      "bytesFree": stats.f_frsize * stats.f_bfree,
                      "bytesAvailable": stats.f_frsize * stats.f_bavail,
                  }
              except OSError:
                  return NOT_AVAILABLE


          def reporter_snapshot(path):
              reporter = pathlib.Path(path)
              try:
                  stat = reporter.stat()
              except OSError:
                  return {"exists": False, "size": 0, "validJson": False}
              valid = False
              if stat.st_size > 0:
                  try:
                      valid = isinstance(json.loads(reporter.read_text(encoding="utf-8")), dict)
                  except (OSError, UnicodeDecodeError, json.JSONDecodeError):
                      valid = False
              return {"exists": True, "size": stat.st_size, "validJson": valid}


          def last_hint(paths):
              candidates = []
              for path in paths:
                  text = read_text(path, limit=65536)
                  if text is None:
                      continue
                  for line in text.splitlines():
                      clean = ANSI_RE.sub("", line).strip()
                      if clean and HINT_RE.search(clean):
                          candidates.append(clean[:512])
              if not candidates:
                  return NOT_AVAILABLE
              hint = candidates[-1]
              return {"text": hint, "sha256": hashlib.sha256(hint.encode("utf-8")).hexdigest()}


          def marker_line(line):
              return line.startswith("[vitest] still running with no output for ") or line.startswith(
                  "[vitest] no output for "
              ) or line.startswith("[vitest] process group still alive after ")


          def read_new_complete_lines(path, offset, carry):
              try:
                  with open(path, "rb") as handle:
                      handle.seek(offset)
                      data = handle.read()
                      next_offset = handle.tell()
              except OSError:
                  return offset, carry, [], False
              changed = bool(data)
              payload = carry + data
              parts = payload.split(b"\n")
              next_carry = parts.pop()
              lines = [part.decode("utf-8", errors="replace") for part in parts]
              return next_offset, next_carry, lines, changed


          def process_exists(pid):
              try:
                  os.kill(pid, 0)
                  return True
              except ProcessLookupError:
                  return False
              except PermissionError:
                  return True


          def sample(args, reason, sequence, started_monotonic):
              pids = process_tree(args.pid) if process_exists(args.pid) else []
              return {
                  "schema": "r7-watchdog-diagnostic-sample-v1",
                  "sequence": sequence,
                  "reason": reason,
                  "utc": utc_now(),
                  "elapsedMillis": int((time.monotonic() - started_monotonic) * 1000),
                  "rootPid": args.pid,
                  "processes": [process_record(pid) for pid in pids] if pids else NOT_AVAILABLE,
                  "system": {
                      "cpuCount": os.cpu_count() if os.cpu_count() is not None else NOT_AVAILABLE,
                      "memory": memory_snapshot(),
                      "pressure": pressure_snapshot(),
                      "workspaceDisk": disk_snapshot(args.workspace),
                      "evidenceDisk": disk_snapshot(args.evidence),
                  },
                  "lastEmittedHint": last_hint([args.stdout, args.stderr]),
                  "reporter": reporter_snapshot(args.reporter),
              }


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--pid", type=int, required=True)
              parser.add_argument("--silence-cap-ms", type=int, required=True)
              parser.add_argument("--heartbeat-ms", type=int, required=True)
              parser.add_argument("--stdout", required=True)
              parser.add_argument("--stderr", required=True)
              parser.add_argument("--reporter", required=True)
              parser.add_argument("--workspace", required=True)
              parser.add_argument("--evidence", required=True)
              parser.add_argument("--output", required=True)
              args = parser.parse_args()
              if args.pid <= 0 or args.silence_cap_ms not in (120000, 300000) or args.heartbeat_ms != 30000:
                  raise SystemExit(2)
              started = time.monotonic()
              last_child_activity = started
              next_periodic = started
              pre_signal_taken_for_activity = None
              offsets = {args.stdout: 0, args.stderr: 0}
              carries = {args.stdout: b"", args.stderr: b""}
