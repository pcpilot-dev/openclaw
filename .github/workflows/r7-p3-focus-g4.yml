          if runner["imageOS"] in {"", "NOT_AVAILABLE"} or runner["imageVersion"] in {"", "NOT_AVAILABLE"}:
              envelope_errors.append("runner image identity is unavailable")
          if runner["imageOS"] != os.environ.get("ImageOS") or runner["imageVersion"] != os.environ.get("ImageVersion"):
              envelope_errors.append("runner image identity changed")
          for marker in (
              "job.started", "harness-guard.started", "harness-guard.ended",
