          if steps["guardCandidate"] == "success" and candidate != {
              "head": os.environ["P3_SHA"], "tree": os.environ["P3_TREE"],
              "parent": os.environ["P2_SHA"], "diffFullIndexSha256": os.environ["P2_P3_FULL_INDEX_SHA256"],
              "numstat": f"12\t7\t{os.environ['TARGET_FILE']}",
          }:
              envelope_errors.append("sealed candidate identity differs from exact P3 contract")
          if envelope_errors and classification in {"PASS", "TEST_FAILURE", "UNKNOWN_INCOMPLETE"}:
              classification = "HARNESS_ERROR"
          phase_complete = test_started is not None and test_ended is not None and test_exit is not None
          evidence_phase = (
              "COMPLETE" if phase_complete and test_exit in (0, 1)
              else "INCOMPLETE" if test_started is not None
              else "NOT_RUN"
          )
          if evidence_phase == "INCOMPLETE":
              for transient_name in ("reporter.json", "gnu-time.txt", "test.exit", "time.exit", "test.ended"):
                  (evidence / transient_name).unlink(missing_ok=True)
          payload_names = canonical_payload_set(classification, evidence_phase, steps)
          finalizer_owned = {
              "final.ended", "final.exit", "finalizer.log", "finalstatus.json", "manifest.json",
          }
          validated_names = sorted(payload_names - finalizer_owned)
          validated_entries = []
          for name in validated_names:
              path = evidence / name
              if path.is_symlink() or not path.is_file():
