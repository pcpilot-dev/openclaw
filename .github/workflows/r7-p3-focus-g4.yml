              f"{hashlib.sha256((root / 'preseal.json').read_bytes()).hexdigest()}  preseal.json\n"
          )
          if (root / "preseal.sha256").read_text(encoding="utf-8") != expected_preseal_hashes:
              raise SystemExit("preseal container hash mismatch")
          entries = [
              {
                  "path": relative,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "bytes": path.stat().st_size,
              }
              for relative in sorted(expected)
              for path in [root / relative]
          ]
          seal_files = root / "seal.files"
          seal_files.write_text(
              "".join(f"{entry['sha256']}  {entry['path']}\n" for entry in entries), encoding="utf-8"
          )
          artifact_files = sorted(expected | {"seal.files", "seal.json", "seal.sha256"})
          seal = {
              "schema": "r7-p3-focus-g4-seal-v1",
              "selfReferenceFree": True,
              "sealedFiles": entries,
              "sealFilesSha256": hashlib.sha256(seal_files.read_bytes()).hexdigest(),
