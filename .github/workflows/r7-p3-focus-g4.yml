              raise SystemExit("invalid finalizer validated-files binding")
          if binding.get("selfReferenceFree") is not True or not isinstance(binding.get("files"), list):
              raise SystemExit("invalid finalizer validated-files shape")
          validated_paths = [entry.get("path") for entry in binding["files"] if isinstance(entry, dict)]
          if validated_paths != expected_validated or len(validated_paths) != len(set(validated_paths)):
              raise SystemExit("independent validated-files path mismatch")
          for entry in binding["files"]:
              path = root / entry["path"]
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"validated path missing or nonregular: {entry['path']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != entry.get("sha256"):
                  raise SystemExit(f"validated-file hash mismatch: {entry['path']}")
              if path.stat().st_size != entry.get("bytes"):
                  raise SystemExit(f"validated-file size mismatch: {entry['path']}")

          preseal = json.loads((root / "preseal.json").read_text(encoding="utf-8"))
          if preseal.get("schema") != "r7-p3-focus-g4-preseal-v1" or preseal.get("selfReferenceFree") is not True:
              raise SystemExit("invalid independent preseal contract")
          if preseal.get("presealContainers") != ["preseal.files", "preseal.json", "preseal.sha256"]:
              raise SystemExit("independent preseal container declaration mismatch")
          if preseal.get("classification") != classification or preseal.get("payloadCount") != len(payload):
              raise SystemExit("preseal disposition/count mismatch")
          preseal_entries = preseal.get("payloadFiles")
          if not isinstance(preseal_entries, list):
              raise SystemExit("preseal payload entries missing")
          preseal_paths = [entry.get("path") for entry in preseal_entries if isinstance(entry, dict)]
          if preseal_paths != sorted(payload) or len(preseal_paths) != len(set(preseal_paths)):
              raise SystemExit("preseal payload paths mismatch")
          expected_binding_digest = hashlib.sha256(
              json.dumps(binding, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          if preseal.get("finalizerValidatedFilesSha256") != expected_binding_digest:
              raise SystemExit("preseal-to-finalizer binding mismatch")
          preseal_lines = []
          for entry in preseal_entries:
              path = root / entry["path"]
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != entry.get("sha256") or path.stat().st_size != entry.get("bytes"):
                  raise SystemExit(f"preseal payload mismatch: {entry['path']}")
              preseal_lines.append(f"{digest}  {entry['bytes']}  {entry['path']}\n")
          if (root / "preseal.files").read_text(encoding="utf-8") != "".join(preseal_lines):
              raise SystemExit("preseal.files mismatch")
          expected_preseal_container = (
              f"{hashlib.sha256((root / 'preseal.files').read_bytes()).hexdigest()}  preseal.files\n"
              f"{hashlib.sha256((root / 'preseal.json').read_bytes()).hexdigest()}  preseal.json\n"
          )
          if (root / "preseal.sha256").read_text(encoding="utf-8") != expected_preseal_container:
              raise SystemExit("preseal container digest mismatch")

          expected_harness = {
              "head": os.environ["GITHUB_SHA"], "parent": os.environ["EXPECTED_H_PARENT"],
              "message": os.environ["EXPECTED_H_MESSAGE"],
              "numstat": f"{os.environ['EXPECTED_H_ADDITIONS']}\t0\t{os.environ['WORKFLOW_PATH']}",
              "workflowPath": os.environ["WORKFLOW_PATH"],
          }
          expected_candidate = {
              "head": os.environ["P3_SHA"], "tree": os.environ["P3_TREE"], "parent": os.environ["P2_SHA"],
              "diffFullIndexSha256": os.environ["P2_P3_FULL_INDEX_SHA256"],
              "numstat": f"12\t7\t{os.environ['TARGET_FILE']}",
          }
          if manifest.get("steps", {}).get("guardHarness") == "success" and manifest.get("harness") != expected_harness:
              raise SystemExit("independent harness manifest mismatch")
          if manifest.get("steps", {}).get("guardCandidate") == "success" and manifest.get("candidate") != expected_candidate:
              raise SystemExit("independent candidate manifest mismatch")
          seal = json.loads((root / "seal.json").read_text(encoding="utf-8"))
          if seal.get("schema") != "r7-p3-focus-g4-seal-v1" or seal.get("selfReferenceFree") is not True:
              raise SystemExit("invalid seal contract")
          actual = set()
          for path in root.rglob("*"):
              relative = path.relative_to(root).as_posix()
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"symlink or nonregular entry in upload set: {relative}")
              actual.add(relative)
          if sorted(actual) != expected_artifacts or seal.get("artifactFiles") != expected_artifacts:
              raise SystemExit("artifact set differs from exact sealed set")
          sealed_paths = [entry.get("path") for entry in seal.get("sealedFiles", [])]
          if sealed_paths != sorted(expected_precontainer) or len(sealed_paths) != len(set(sealed_paths)):
              raise SystemExit("sealedFiles differs from reconstructed canonical pre-container set")
          expected_lines = []
          for entry in seal["sealedFiles"]:
              path = root / entry["path"]
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"sealed path missing or non-regular: {entry['path']}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != entry["sha256"] or path.stat().st_size != entry["bytes"]:
                  raise SystemExit(f"sealed file mismatch: {entry['path']}")
              expected_lines.append(f"{digest}  {entry['path']}\n")
          if (root / "seal.files").read_text(encoding="utf-8") != "".join(expected_lines):
              raise SystemExit("seal.files differs from recomputed set")
          if hashlib.sha256((root / "seal.files").read_bytes()).hexdigest() != seal["sealFilesSha256"]:
              raise SystemExit("seal.files digest mismatch")
          expected_container = (
              f"{hashlib.sha256((root / 'seal.files').read_bytes()).hexdigest()}  seal.files\n"
              f"{hashlib.sha256((root / 'seal.json').read_bytes()).hexdigest()}  seal.json\n"
          )
          if (root / "seal.sha256").read_text(encoding="utf-8") != expected_container:
              raise SystemExit("seal container digest mismatch")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          receipt = manifest.get("immutableRiskHistory", {}).get("notRunReceipt", {})
          if manifest.get("selfReferenceFree") is not True or manifest.get("heavyClaim") is not False:
              raise SystemExit("manifest self-reference/heavy claim mismatch")
          if receipt.get("passInput") is not False or receipt.get("disposition") != "NOT_RUN":
              raise SystemExit("NOT_RUN receipt was promoted into pass input")
          classification = manifest.get("result", {}).get("classification")
          finalstatus = json.loads((root / "finalstatus.json").read_text(encoding="utf-8"))
          expected_status = "PASS" if classification == "PASS" else "FAIL"
          if (
              finalstatus.get("classification") != classification
              or finalstatus.get("status") != expected_status
              or finalstatus.get("heavyClaim") is not False
              or finalstatus.get("buildClaim") is not False
          ):
              raise SystemExit("final status differs from sealed disposition")
          utc_re = re.compile(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z\n$")
          times = {}
          for name in ("job.started", "final.started", "final.ended"):
              text = (root / name).read_text(encoding="ascii")
              if len(text) != 21 or not utc_re.fullmatch(text):
                  raise SystemExit(f"invalid final UTC marker: {name}")
              times[name] = datetime.datetime.strptime(text.strip(), "%Y-%m-%dT%H:%M:%SZ")
          if times["final.started"] < times["job.started"] or times["final.ended"] < times["final.started"]:
              raise SystemExit("final UTC ordering mismatch")
          expected_final_exit = "0\n" if classification == "PASS" else "1\n"
          if (root / "final.exit").read_text(encoding="ascii") != expected_final_exit:
              raise SystemExit("final exit differs from sealed disposition")
          PY

      - name: Upload complete exact G3 evidence envelope
        id: upload
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r7-p3-focus-g4-P3-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r7-p3-focus-g4-evidence
          if-no-files-found: error
          retention-days: 90
          overwrite: false
