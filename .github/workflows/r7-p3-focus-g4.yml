          except (OSError, UnicodeDecodeError, json.JSONDecodeError):
              report = None
          report_validation = validate_report(report, os.environ["TARGET_FILE"], os.environ["TARGET_ASSERTION"])
          expected_command = (
              f"node scripts/run-vitest.mjs run --config {os.environ['TARGET_CONFIG']} "
              f"{os.environ['TARGET_FILE']} --reporter=verbose --reporter=json "
              f"--outputFile.json={bound_json}\n"
          )
          gnu_time_text = read_text("gnu-time.txt", required=False)
          gnu_time_validation = parse_gnu_time(gnu_time_text, test_exit, time_exit, expected_command)
          command_evidence = read_text("command.txt", required=False)
          if test_started is not None and command_evidence != expected_command:
              envelope_errors.append("command evidence differs from exact focus invocation")
          incomplete = test_started is not None and (
              test_ended is None or test_exit is None or test_exit in (137, 143) or watchdog["terminalMarkerObserved"]
          )
          classification = "HARNESS_ERROR"
