              "diffFullIndexSha256": (read_text("candidate.diff-full-index.sha256", required=False) or "").strip(),
              "numstat": (read_text("candidate.numstat", required=False) or "").strip(),
          }
          expected_h_numstat = f"{os.environ['EXPECTED_H_ADDITIONS']}\t0\t{os.environ['WORKFLOW_PATH']}"
          if steps["guardHarness"] == "success" and harness != {
              "head": os.environ["GITHUB_SHA"], "parent": os.environ["EXPECTED_H_PARENT"],
              "message": os.environ["EXPECTED_H_MESSAGE"], "numstat": expected_h_numstat,
              "workflowPath": os.environ["WORKFLOW_PATH"],
          }:
